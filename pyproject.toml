[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seat-defect-core"
version = "0.1.0"
description = "Core inspect runtime for automotive seat defect inspection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "opencv-python",
  "torch",
  "torchvision",
  "ultralytics",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.package-data]
seat_defect_core = ["USAGE.md"]

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "seat_defect_core",
  "seat_defect_core.*",
]
exclude = [
  "seat_defect_inspection",
  "seat_defect_inspection.*",
  "media_inputs",
  "media_inputs.*",
  "mvsCamera",
  "mvsCamera.*",
]
