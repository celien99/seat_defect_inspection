[seat_defect_inspection]
output_json_path = ../outputs/seat_defect_inspection/labview_results.json
debug_dir = ../outputs/seat_defect_inspection/labview_debug
debug_artifacts_enabled = false
part_id = seat_demo

[fusion]
reject_on_any_reject = true
ng_strategy = any
defect_overrides_reject = true

[camera.cam_0]
source = 0
patchcore_model_path = ../models/seat_defect_inspection/cam_0_patchcore.npz
enabled = true
color_insensitive_mode = true

[camera.cam_0.detection]
model_path = ../models/seat_defect_inspection/yolo/best.pt
target_class = seat
confidence = 0.25
iou = 0.45
device = cpu

[camera.cam_0.roi]
crop_expand_ratio = 0.05
crop_shrink_ratio = 0.0
mask_erode_pixels = 1
edge_ignore_pixels = 6

[camera.cam_0.roi.alignment]
output_width = 256
output_height = 256

[camera.cam_0.patchcore]
backend = full
backbone_pretrained = true
feature_layers = layer2, layer3
backbone_device = cpu

[camera.cam_0.color_branch]
enabled = false
