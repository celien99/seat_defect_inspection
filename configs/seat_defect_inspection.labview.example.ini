[seat_defect_inspection]
output_json_path = ../outputs/seat_defect_inspection/labview_results.json
debug_dir = ../outputs/seat_defect_inspection/labview_debug
debug_artifacts_enabled = true
part_id = seat_production

[fusion]
reject_on_any_reject = true
ng_strategy = any
defect_overrides_reject = true

[camera.cam_0]
source = mvs://sn/DA9184658?timeout_ms=1000&exposure_auto=off&exposure_time=8000
patchcore_model_path = ../models/seat_defect_inspection/cam_0_patchcore.npz
enabled = true
color_insensitive_mode = false

[camera.cam_0.quality]
min_laplacian_variance = 80
min_brightness_mean = 30
max_brightness_mean = 225
max_overexposed_ratio = 0.25
max_underexposed_ratio = 0.35

[camera.cam_0.detection]
model_path = ../best.pt
target_class = seat
confidence = 0.35
iou = 0.45
imgsz = 960
device = cuda:0

[camera.cam_0.roi]
crop_expand_ratio = 0.04
crop_shrink_ratio = 0
mask_erode_pixels = 1
edge_ignore_pixels = 4

[camera.cam_0.roi.alignment]
output_width = 384
output_height = 384

[camera.cam_0.patchcore]
backend = full
image_size = 384
patch_size = 16
stride = 8
max_memory = 512
threshold_quantile = 0.9
coreset_sampling_ratio = 0.1
texture_input = lab_l
backbone_name = wide_resnet50_2
feature_layers = layer2, layer3
backbone_pretrained = true
backbone_device = cuda
min_target_coverage = 0.55
max_ignore_overlap = 0.15
min_valid_patch_ratio = 0.35
decision_score_margin = 1
strong_patch_score_ratio = 0.8
min_strong_patch_count = 2
min_strong_component_count = 1
min_strong_patch_ratio = 0.004
min_strong_component_ratio = 0.002
critical_score_margin = 1
critical_peak_score_margin = 1.05
critical_min_component_patch_count = 2

[camera.cam_0.color_branch]
enabled = false
threshold_quantile = 0.97
min_valid_pixel_ratio = 0.3

[camera.cam_0.region.upper]
box = 0.03, 0.03, 0.97, 0.42
patchcore_model_path = ../models/seat_defect_inspection/cam_0_upper_patchcore.npz
enabled = true

[camera.cam_0.region.middle]
box = 0.03, 0.33, 0.97, 0.74
patchcore_model_path = ../models/seat_defect_inspection/cam_0_middle_patchcore.npz
enabled = true

[camera.cam_0.region.lower]
box = 0.03, 0.66, 0.97, 0.97
patchcore_model_path = ../models/seat_defect_inspection/cam_0_lower_patchcore.npz
enabled = true

